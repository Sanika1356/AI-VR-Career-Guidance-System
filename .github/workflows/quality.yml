name: Quality and security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Client, server, migration, and dependency checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_vr_career_guidance
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
      AI_ADVISOR_ENABLED: true
      OLLAMA_ENABLED: false
      GEMINI_ENABLED: false
      SECONDARY_AI_ENABLED: false
      RUN_SEED_DATA: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_vr_career_guidance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_vr_career_guidance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check client formatting, types, and production build
        run: pnpm --dir client check
      - name: Check server types and production build
        run: pnpm --dir server typecheck && pnpm --dir server build
      - name: Run server, migration, privacy, and contract-facing tests
        run: pnpm --dir server test
      - name: Apply migrations to disposable PostgreSQL
        run: pnpm --dir server db:migrate
      - name: Run PostgreSQL-backed API integration test
        env:
          RUN_DB_INTEGRATION_TESTS: true
        run: pnpm --dir server test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
