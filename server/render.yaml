services:
  - type: web
    name: ai-vr-career-guidance-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --dir server build
    startCommand: pnpm --dir server db:migrate && pnpm --dir server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: RUN_SEED_DATA
        value: "true"
      - key: DB_POOL_MIN
        value: "1"
      - key: DB_POOL_MAX
        value: "5"
      - key: TOKEN_EXPIRY_SECONDS
        value: "86400"
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: AI_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: AI_RATE_LIMIT_MAX
        value: "20"
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.2:3b
      - key: AI_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: AI_MAX_RESPONSE_CHARS
        value: "4000"
      - key: AI_RETRY_ATTEMPTS
        value: "1"
